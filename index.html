<!doctype html>
<html lang="en" data-bs-theme="light">
    <head>
        <title>To Do List</title>
        <!-- required meta tags -->
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <!-- bootstrap css -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous"
        />
        <link rel="stylesheet" href="styles.css"/>
        <link rel="stylesheet" href="https://use.typekit.net/gpw1gdb.css">
    </head>
    
    
    
    <body>
        <main class="container mt-5">
            
            <div class="row justify-content-center">
                <h2 class="titlefont text-center">°｡⋆ ☆ - To Do List - ☆ ⋆｡°</h2>
                    <div class="col-md-8 col-lg-6">
                    <div class="row">
                        <div class="col-8">
                            <input type="text" id="taskInput" class="form-control entertaskbutton" placeholder="Enter your task!"/>
                        </div>
                        <div class="col-4">
                            <button id="addTaskBtn" class="btn addtaskbutton w-100">Add Task</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="row">
                <div class="col-12">
                    <h4 id="taskCounter" class="text-center mt-3 countertext">Tasks Left: 0 | Completed: 0</h4>
                </div>
            </div>

            <div class="row">
                <div class="col-12">
                    <img src="activetasks.png" height="40px">
                    <ul id="taskList" class="list-group mt-3"></ul>
                </div>
            </div>

            <div class="row">
                <div class="col-12">
                    <img src="completedtasks.png" class="ctmarginsonly" height="40px">
                    <ul id="completedTaskList" class="list-group mt-3"></ul>
                </div>
            </div>

            <div class="row">
                <div class="col-12">
                    <button id="clearTaskBtn" class="btn clearalltasksbutton w-100 mt-3">
                        <img src="clearalltasks.png" class="stars" height="35px">
                        Clear All Tasks
                        <img src="clearalltasks.png" class="stars" height="35px">
                    </button>
                </div>
            </div>
        </main>

        <footer>
            <div class="footerdiv">
                <p class="mb-0">© 2026 Sofia Rashid • Web 2</p>
            </div>
        </footer>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
        <script src="script.js"></script>
        
    </body>
</html>
